<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <!-- Google Fonts for sleek tech numbers -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Modern Design System Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --calc-bg: #1e293b;
            --screen-bg: #0f172a;
            --btn-num: #334155;
            --btn-num-hover: #475569;
            --btn-op: #f59e0b;
            --btn-op-hover: #d97706;
            --btn-clear: #ef4444;
            --btn-clear-hover: #dc2626;
            --btn-equal: #10b981;
            --btn-equal-hover: #059669;
            --text-light: #f8fafc;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-transform: capitalize;
        }

        /* Responsive Main Container Card */
        .main {
            background-color: var(--calc-bg);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Screen Display Box Layout */
        .screen-container {
            width: 100%;
        }

        input {
            width: 100%;
            padding: 20px;
            font-size: 28px;
            font-weight: 500;
            text-align: right;
            border-radius: 16px;
            border: none;
            background-color: var(--screen-bg);
            color: var(--text-light);
            outline: none;
            letter-spacing: 0.5px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Grid Framework for Button Alignments */
        .row-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Split layout row for clear buttons spanning double spaces */
        .clear-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            background-color: var(--btn-num);
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: var(--btn-num-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Categorized Variant Button Color Palette Overrides */
        .btn-clr {
            background-color: var(--btn-clear);
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-clr:hover { background-color: var(--btn-clear-hover); }

        .btn-operator {
            background-color: var(--btn-op);
        }
        .btn-operator:hover { background-color: var(--btn-op-hover); }

        .btn-eq {
            background-color: var(--btn-equal);
        }
        .btn-eq:hover { background-color: var(--btn-equal-hover); }

        /* Responsive design rules for mobile viewports */
        @media (max-width: 400px) {
            .main {
                padding: 16px;
                gap: 12px;
            }
            button {
                padding: 14px;
                font-size: 18px;
                border-radius: 10px;
            }
            input {
                font-size: 24px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <h1>Calculator</h1>
    
    <div class="main">
        <div class="screen-container">
            <!-- Retained matching display input element id -->
            <input readonly type="text" id="ipp" placeholder="0">
        </div>

        <!-- Top utility clear system layout -->
        <div class="clear-row">
            <button class="btn-clr" onclick="clrOne()">Clear</button>
            <button class="btn-clr" onclick="clrAll()">Clear All</button>
        </div>

        <!-- Keypad layouts keeping original function triggers -->
        <div class="row-grid">
            <button onclick="getvalue(7)">7</button>
            <button onclick="getvalue(8)">8</button>
            <button onclick="getvalue(9)">9</button>
            <button class="btn-operator" onclick="getvalue('+')">+</button>
        </div>

        <div class="row-grid">
            <button onclick="getvalue(4)">4</button>
            <button onclick="getvalue(5)">5</button>
            <button onclick="getvalue(6)">6</button>
            <button class="btn-operator" onclick="getvalue('-')">-</button>
        </div>

        <div class="row-grid">
            <button onclick="getvalue(1)">1</button>
            <button onclick="getvalue(2)">2</button>
            <button onclick="getvalue(3)">3</button>
            <button class="btn-operator" onclick="getvalue('*')">×</button>
        </div>

        <div class="row-grid">
            <button onclick="getvalue(0)">0</button>
            <button class="btn-operator" onclick="getvalue('/')">÷</button>
            <button onclick="getvalue('.')">.</button>
            <button class="btn-eq" onclick="solution()">=</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
